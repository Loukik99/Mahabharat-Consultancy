    <!-- Legacy HashRouter URLs (#/path) → History API paths for crawlable SEO -->
    <script>
      (function () {
        var h = window.location.hash;
        if (h && h.indexOf("#/") === 0) {
          var path = h.slice(1);
          var target =
            window.location.pathname.replace(/\/$/, "") +
            path +
            window.location.search;
          window.location.replace(target);
        }
      })();
    </script>
